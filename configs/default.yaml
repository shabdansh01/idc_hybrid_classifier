model:
  type: "hybrid"
  cnn:
    backbone: "convnext_tiny"
    pretrained: true
    feature_dim: 768
    freeze_stages: 2
    hf_repo: "FatimaK6/breast-cancer-convnext-tiny"
  vit:
    backbone: "swin_tiny_patch4_window7_224"
    pretrained: true
    img_size: 56
    feature_dim: 768
    freeze_layers: 8
  fusion:
    project_dim: 512
    use_alignment: true
  head:
    hidden_dims: [512, 256]
    dropout: 0.4
    use_layernorm: true

data:
  input_size: 50
  target_size: 56
  num_classes: 1
  stain_norm:
    # method: null  # or "macenko" 
    method: "macenko"   # or "macenko" 
  augmentation:
    train:
      # rotation: 360
      rotation: 90
      horizontal_flip: true
      vertical_flip: true
      color_jitter: 0.2
      # gaussian_noise: 0.01
      gaussian_noise: 0
      # elastic_transform: true
      elastic_transform: false

training:
  # batch_size: 64
  batch_size: 64
  num_epochs: 100
  num_workers: 8
  pin_memory: true
  # optimizer:
  #   type: "adamw"
  #   lr: 0.0001
  #   weight_decay: 0.05
  #   betas: [0.9, 0.999]
  optimizer:
    type: "adamw"
    lr: 0.00005  # ← Lower from 0.0001 (halves initial step size)
    weight_decay: 0.01  # ← Critical: Drop from 0.05 (standard for vision/ViT per Fast.ai)
    betas: [0.9, 0.999]
  # scheduler:
  #   type: "cosine"
  #   warmup_epochs: 5
  #   min_lr: 0.000001

  scheduler:
    type: "cosine"
    warmup_epochs: 5
    min_lr: 0.000001
  gradient_clip: 0.5  # ← Tighten from 1.0 (caps explosions earlier)
  loss:
    type: "bce_logits"
    pos_weight: 1.0
  early_stopping:
    patience: 15
    metric: "val_auc"
    mode: "max"
  # mixed_precision: true
  mixed_precision: false
  # gradient_clip: 1.0

paths:
  data_dir: "C:/Users/Shabdansh/Downloads/idc_hybrid_classifier/data_kaggle"  # UPDATE THIS
  output_dir: "outputs"
  checkpoint_dir: "outputs/checkpoints"
  log_dir: "outputs/logs"

logging:
  use_wandb: false
  use_tensorboard: true
  save_freq: 5
  log_freq: 10

seed: 42
deterministic: true